services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: issueflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-issueflow_local}
      POSTGRES_DB: issueflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issueflow -d issueflow"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://issueflow:${POSTGRES_PASSWORD:-issueflow_local}@db:5432/issueflow
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [api]
volumes:
  postgres_data:
